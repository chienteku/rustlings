# The format version is an indicator of the compatibility of community exercises with the
# Rustlings program.
format_version = 1

# Welcome message shown when starting the exercises
welcome_message = """Welcome to Rustlings!

This project contains small exercises to get you used to reading and writing Rust code.
This includes reading and responding to compiler messages!"""

# Final message shown after completing all exercises
final_message = """We hope you enjoyed learning about the various aspects of Rust!
If you noticed any issues, don't hesitate to report them on GitHub.
You can also contribute your own exercises to share with others!

Before reporting an issue or contributing, please read our guidelines:
https://github.com/rust-lang/rustlings/blob/main/CONTRIBUTING.md"""

